<svg width="40" height="40" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoIconGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Heartbeat/Wave line (left side) -->
  <path d="M 10 60 Q 20 40, 30 50 T 50 45 T 70 55 T 90 50" 
        stroke="url(#logoIconGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Smile/Arrow curve (right side) -->
  <path d="M 90 50 Q 95 45, 100 50 Q 105 55, 110 60" 
        stroke="url(#logoIconGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        fill="none"/>
  
  <!-- Arrow pointing up -->
  <path d="M 110 60 L 110 50 L 115 55 L 110 60 L 105 55 Z" 
        fill="url(#logoIconGradient)"/>
  
  <!-- Eyes (dots above smile) -->
  <circle cx="95" cy="45" r="3" fill="#eab308" opacity="0.9"/>
  <circle cx="105" cy="45" r="3" fill="#eab308" opacity="0.9"/>
  
  <!-- Sparkles/light rays above -->
  <g opacity="0.7">
    <circle cx="92" cy="38" r="1.5" fill="#eab308"/>
    <circle cx="98" cy="35" r="1" fill="#fbbf24"/>
    <circle cx="108" cy="35" r="1" fill="#fbbf24"/>
    <circle cx="113" cy="38" r="1.5" fill="#eab308"/>
    <line x1="90" y1="40" x2="88" y2="38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="115" y1="40" x2="117" y2="38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="42" x2="100" y2="40" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>


















